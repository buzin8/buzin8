<svg xmlns="http://www.w3.org/2000/svg"
     width="200" height="46" viewBox="0 0 200 46">
  <title>GitHub Profile</title>

  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC6"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#008CFF"/>
    </linearGradient>

    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10232E"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
  </defs>

  <!-- Angular cyberpunk panel -->
  <path
    d="M12 3 H187 L197 13 V33 L187 43 H12 L3 34 V12 Z"
    fill="url(#panel)"/>

  <!-- Layered neon border -->
  <g fill="none" stroke="url(#neon)">
    <path
      d="M12 3 H187 L197 13 V33 L187 43 H12 L3 34 V12 Z"
      stroke-width="6" opacity="0.08"/>
    <path
      d="M12 3 H187 L197 13 V33 L187 43 H12 L3 34 V12 Z"
      stroke-width="3" opacity="0.22"/>
    <path
      d="M12 3 H187 L197 13 V33 L187 43 H12 L3 34 V12 Z"
      stroke-width="1.2"/>
  </g>

  <!-- Bright corner accents -->
  <path d="M12 3 H43 M167 43 H187 L197 33"
        fill="none" stroke="#00E5FF" stroke-width="2"/>

  <!-- Circuit-style details -->
  <path d="M53 8 H68 M72 8 H78"
        stroke="#00FFC6" stroke-width="1" opacity="0.5"/>
  <path d="M121 38 H144 M148 38 H153"
        stroke="#00E5FF" stroke-width="1" opacity="0.45"/>

  <!-- GitHub-style outline logo inside the button -->
  <g transform="translate(17 11)"
     fill="none" stroke="#00FFC6"
     stroke-width="1.7"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M9 19c-4.3 1.4-4.3-2.5-6-3"/>
    <path d="M15 22v-3.87a3.37 3.37 0 0 0-.94-2.61
             c3.14-.35 6.44-1.54 6.44-7
             A5.44 5.44 0 0 0 19 4.77
             A5.07 5.07 0 0 0 18.91 1
             S17.73.65 15 2.48
             a13.38 13.38 0 0 0-7 0
             C5.27.65 4.09 1 4.09 1
             A5.07 5.07 0 0 0 4 4.77
             a5.44 5.44 0 0 0-1.5 3.78
             c0 5.42 3.3 6.61 6.44 7
             A3.37 3.37 0 0 0 8 18.13V22"/>
  </g>

  <!-- Logo/text separator -->
  <path d="M48 14 V32"
        stroke="#00E5FF" opacity="0.3"/>

  <text
    x="120" y="27.5"
    text-anchor="middle"
    font-family="'Segoe UI',Arial,sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="0.6"
    fill="#E8FCFF">GITHUB PROFILE ↗</text>
</svg>
