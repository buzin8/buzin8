<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="NEON//IDENTITY — ANUBHAB MUKHERJEE, Electronics and Communication Engineer">
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B10" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#080B10" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#080B10" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080B10" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#080B10" stop-opacity="0.20"/>
      <stop offset="0.72" stop-color="#080B10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0066FF"/><stop offset="0.5" stop-color="#00E5FF"/><stop offset="1" stop-color="#00FFC6"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.55"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#080B10"/>
  <image href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCg=="/>
  <rect width="1200" height="675" fill="url(#tint)"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>

  <!-- top bar -->
  <rect width="1200" height="60" fill="#080B10" fill-opacity="0.72"/>
  <rect y="59" width="1200" height="1" fill="#00E5FF" fill-opacity="0.18"/>
  <circle cx="58" cy="30" r="4" fill="#00FFC6"/>
  <text x="76" y="35" font-family="Consolas,'JetBrains Mono','Courier New',monospace" font-size="14" font-weight="700" fill="#00FFC6" letter-spacing="2">NEON//IDENTITY</text>
  <rect x="1020" y="14" width="130" height="32" rx="16" fill="url(#btn)"/>
  <text x="1085" y="35" text-anchor="middle" font-family="'Chakra Petch','Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#080B10" letter-spacing="1.2">LIVE</text>

  <g filter="url(#shadow)">
    <circle cx="62" cy="168" r="4" fill="#00FFC6"/>
    <text x="78" y="173" font-family="'Chakra Petch','Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#00FFC6" letter-spacing="3">SYSTEM // ONLINE</text>
    <text x="268" y="173" font-family="'Chakra Petch','Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#B8F4FF" letter-spacing="1">[ 22.5726° N, 88.3639° E ]</text>
  </g>

  <!-- name: solid cyan, glowing -->
  <g font-family="'Chakra Petch','Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="70" fill="#00E5FF" letter-spacing="1.4" filter="url(#glow)">
    <text x="60" y="250">ANUBHAB</text>
    <text x="60" y="322">MUKHERJEE</text>
  </g>

  <g filter="url(#shadow)">
