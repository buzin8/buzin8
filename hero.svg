    <rect x="60" y="398" width="2" height="76" fill="#00FFC6"/>
    <text x="78" y="425" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#FFFFFF">ECE grad | <tspan fill="#00E5FF" font-weight="700">JavaScript, Python, Next.js, React, SQL, PostgreSQL</tspan></text>
    <text x="78" y="458" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#B8F4FF">Seeking entry-level IT support, network administration, cybersecurity and web roles.</text>
  </g>

  <!-- chips -->
  <g font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="60" y="494" width="124" height="34" rx="17" fill="#080B10" fill-opacity="0.78" stroke="#00E5FF" stroke-opacity="0.45"/>
    <text x="122" y="516" text-anchor="middle" fill="#FFFFFF">📍 Kolkata, IN</text>
    <rect x="196" y="494" width="150" height="34" rx="17" fill="#080B10" fill-opacity="0.78" stroke="#00E5FF" stroke-opacity="0.45"/>
    <text x="271" y="516" text-anchor="middle" fill="#FFFFFF">🎓 B.Tech ECE 2026</text>
    <rect x="358" y="494" width="196" height="34" rx="17" fill="#080B10" fill-opacity="0.78" stroke="#00FFC6" stroke-opacity="0.6"/>
    <circle cx="376" cy="511" r="3.5" fill="#00FFC6"/>
    <text x="392" y="516" fill="#00FFC6">Open to entry-level roles</text>
