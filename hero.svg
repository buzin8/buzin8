<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="NEON//IDENTITY - ANUBHAB MUKHERJEE">
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B10" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#080B10" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#080B10" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080B10" stop-opacity="0.54"/>
      <stop offset="0.45" stop-color="#080B10" stop-opacity="0.18"/>
      <stop offset="0.78" stop-color="#080B10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0066FF"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00FFC6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-25%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#080B10"/>

  <image href="spiderverse-hero-right.jpg" x="560" y="0" width="640" height="675" preserveAspectRatio="xMidYMid slice" opacity="0.96"/>

  <rect width="1200" height="675" fill="url(#tint)"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>

  <g>
    <circle cx="64" cy="28" r="5" fill="#00FFC6"/>
    <text x="82" y="34" font-family="Consolas, 'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00FFC6" letter-spacing="2">NEON//IDENTITY</text>
  </g>

  <g filter="url(#glow)">
    <text x="62" y="142" font-family="'Chakra Petch', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#00E5FF" letter-spacing="4">SYSTEM // ONLINE</text>
    <text x="52" y="235" font-family="'Chakra Petch', 'Segoe UI', sans-serif" font-size="68" font-weight="700" fill="#F3F7FA" letter-spacing="1.2">ANUBHAB</text>
    <text x="52" y="310" font-family="'Chakra Petch', 'Segoe UI', sans-serif" font-size="68" font-weight="700" fill="#00E5FF" letter-spacing="1.2">MUKHERJEE</text>
  </g>

  <g>
    <text x="60" y="355" font-family="'Chakra Petch', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#00FFC6" letter-spacing="3">ELECTRONICS &amp; COMMUNICATION ENGINEER</text>

    <rect x="60" y="380" width="2" height="90" fill="#00E5FF"/>

    <text x="80" y="420" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="18" fill="#F3F7FA">
      ECE grad | JavaScript, Python, Next.js, React, SQL, PostgreSQL
    </text>
    <text x="80" y="450" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" fill="#B7CAD8">
      Ex-intern, Haldia Petrochemicals (networking)
    </text>
    <text x="80" y="478" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" fill="#C9D4DF">
      Seeking entry-level IT support, network administration, cybersecurity and web roles.
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="520" width="200" height="42" rx="19" fill="url(#btn)"/>
    <text x="160" y="548" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#041218">VIEW 8 PROJECTS</text>

    <rect x="280" y="520" width="205" height="42" rx="19" fill="url(#btn)"/>
    <text x="382.5" y="548" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#041218">LIVE PORTFOLIO</text>

    <rect x="500" y="520" width="175" height="42" rx="19" fill="url(#btn)"/>
    <text x="587.5" y="548" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#041218">GITHUB</text>
  </g>
</svg>
