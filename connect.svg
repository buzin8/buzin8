<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Connect &amp; Contact" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>

    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="28%" stop-color="#008CFF"/>
      <stop offset="58%" stop-color="#00CFFF"/>
      <stop offset="78%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFC6"/>
    </linearGradient>
    <linearGradient id="cyanSec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B8D9"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFC6"/>
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,229,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(0,140,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,255,198,0.35)"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B27" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0C121B" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="cardTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFC6"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(0,229,255,0.18)"/>
      <stop offset="40%" stop-color="rgba(0,140,255,0.08)"/>
      <stop offset="80%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00E5FF" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

