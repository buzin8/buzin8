  <rect width="1200" height="180" rx="16" fill="#080B10"/>
  <rect x="2" y="2" width="1196" height="176" rx="15" fill="#111B27" fill-opacity="0.95" stroke="url(#cyanBorder)" stroke-width="1.2"/>
  <rect x="2" y="2" width="1196" height="3" fill="url(#cardTopGrad)"/>

  <!-- Circuit Trace Background Lines -->
  <path d="M 60 90 L 260 90 L 300 90 L 550 90 L 600 90 L 850 90 L 900 90 L 1140 90" fill="none" stroke="rgba(0,229,255,0.18)" stroke-width="1.5" stroke-dasharray="4 4"/>

